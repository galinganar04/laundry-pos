<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hawi's Lovada - Replenishments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #1e293b; color: white; min-height: 100vh; padding-top: 20px; }
        .sidebar h4 { color: #60a5fa; }
        .sidebar a { color: #cbd5e1; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #3b82f6; color: white; border-radius: 5px; }
        .panel { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        [data-theme="dark"] body { background-color: #0f172a !important; color: #e2e8f0 !important; }
        [data-theme="dark"] .sidebar { background-color: #020617 !important; }
        [data-theme="dark"] .sidebar h4 { color: #60a5fa !important; }
        [data-theme="dark"] .sidebar a { color: #94a3b8 !important; }
        [data-theme="dark"] .sidebar a:hover, [data-theme="dark"] .sidebar a.active { background-color: #1e40af !important; color: white !important; }
        [data-theme="dark"] .panel { background-color: #1e293b !important; color: #e2e8f0 !important; }
        [data-theme="dark"] .table { color: #e2e8f0 !important; }
        [data-theme="dark"] .table th { color: #cbd5e1 !important; border-color: #334155 !important; }
        [data-theme="dark"] .table td { border-color: #334155 !important; }
        [data-theme="dark"] .text-muted { color: #94a3b8 !important; }
        [data-theme="dark"] h3 { color: #e2e8f0 !important; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-none d-md-block">
            <h4 class="text-center mb-4">Hawi's Lovada</h4>
            <a href="/">🧺 POS</a>
            <a href="/dashboard.html">📊 Dashboard</a>
            <a href="/reports.html">📈 Reports</a>
            <a href="/orders.html">📋 Orders</a>
            <a href="/products.html">📦 Products</a>
            <a href="/products.html">📦 Products</a>
            <a href="/services.html">🧴 Services</a>
            <a href="/customers.html">👥 Customers</a>
            <a href="/settings.html">⚙️ Settings</a>
            <a href="#" class="theme-toggle">🌙 Dark Mode</a>
            <a href="#" onclick="logout()">🚪 Logout</a>
        </div>

        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">Replenishment Log</h3>
                <a href="/products.html" class="btn btn-outline-secondary">← Back to Products</a>
            </div>

            <div class="panel">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Date</th>
                                <th>Product</th>
                                <th class="text-end">Quantity Added</th>
                                <th class="text-end">Total Cost</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody id="replenishTable">
                            <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const authToken = localStorage.getItem('authToken');
    if (!authToken) { window.location.href = '/login.html'; }

    fetch('/api/replenishments', { headers: { 'x-auth-token': authToken } })
        .then(res => {
            if (res.status === 401) { localStorage.removeItem('authToken'); window.location.href = '/login.html'; return; }
            return res.json();
        })
        .then(items => {
            if (!items) return;
            const table = document.getElementById('replenishTable');
            if (items.length === 0) {
                table.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No replenishments yet.</td></tr>';
                return;
            }
            table.innerHTML = items.map(r => {
                const date = new Date(r.date).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
                return `
                    <tr>
                        <td>#${r.id}</td>
                        <td><small>${date}</small></td>
                        <td><strong>${r.product_name}</strong></td>
                        <td class="text-end"><span class="badge bg-success">+${r.quantity} pc</span></td>
                        <td class="text-end">₱${parseFloat(r.cost).toFixed(2)}</td>
                        <td><small class="text-muted">${r.notes || '-'}</small></td>
                    </tr>
                `;
            }).join('');
        });

    function logout() {
        const token = localStorage.getItem('authToken');
        if (token) fetch('/api/logout', { method: 'POST', headers: { 'x-auth-token': token } });
        localStorage.removeItem('authToken');
        window.location.href = '/login.html';
    }
</script>
<script src="/theme.js"></script>
</body>
</html>
