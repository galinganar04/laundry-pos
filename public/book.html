<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book a Pickup - Hawi's Lovada</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <meta name="theme-color" content="#1e3a8a">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px 16px;
            margin: 0;
        }
        .book-wrap { max-width: 460px; margin: 0 auto; }
        .book-card {
            background: white;
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .logo-wrap { text-align: center; margin-bottom: 16px; }
        .logo-wrap img { max-width: 130px; height: auto; }
        h2 { text-align: center; color: #1e3a8a; margin: 0 0 4px 0; font-weight: 700; font-size: 22px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 22px; }
        .form-label { font-size: 12px; color: #475569; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control, .form-select {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 15px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
            outline: none;
        }
        .btn-book {
            background: #1e40af;
            color: white;
            border: none;
            padding: 16px;
            font-weight: 700;
            width: 100%;
            border-radius: 10px;
            margin-top: 14px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-book:hover { background: #1e3a8a; }
        .btn-book:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            display: none;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
        }
        .success {
            display: none;
            text-align: center;
            padding: 20px 0;
        }
        .success .check {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #10b981;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin-bottom: 16px;
        }
        .success h3 { color: #065f46; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
        .success p { color: #64748b; font-size: 14px; margin-bottom: 6px; }
        .success .booking-id {
            background: #f0fdf4;
            border: 2px solid #10b981;
            color: #065f46;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 18px;
            margin: 14px 0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover { color: #1e40af; text-decoration: underline; }
        .call-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: #1e40af;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="book-wrap">
        <div class="book-card">
            <div class="logo-wrap">
                <img src="/logo.png" alt="Hawi's Lovada" onerror="this.style.display='none'">
            </div>
            <h2>📅 Book a Pickup</h2>
            <p class="subtitle">We'll come pick up your laundry</p>

            <form id="bookingForm" onsubmit="submitBooking(event)">
                <div class="mb-3">
                    <label class="form-label">Your Name *</label>
                    <input type="text" id="customerName" class="form-control" placeholder="e.g., Juan Dela Cruz" autocomplete="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cellphone Number *</label>
                    <input type="tel" id="customerPhone" class="form-control" placeholder="09XXXXXXXXX" maxlength="11" inputmode="numeric" autocomplete="tel" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Pickup Address *</label>
                    <textarea id="customerAddress" class="form-control" rows="2" placeholder="House #, Street, Barangay, City" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Service *</label>
                    <select id="serviceType" class="form-select" required>
                        <option value="">-- Choose service --</option>
                    </select>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label">Pickup Date *</label>
                        <input type="date" id="pickupDate" class="form-control" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Time Slot *</label>
                        <select id="pickupTime" class="form-select" required>
                            <option value="">-- Pick --</option>
                            <option value="Morning (8-11 AM)">Morning (8-11 AM)</option>
                            <option value="Afternoon (1-4 PM)">Afternoon (1-4 PM)</option>
                            <option value="Evening (4-7 PM)">Evening (4-7 PM)</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Notes (optional)</label>
                    <input type="text" id="bookingNotes" class="form-control" placeholder="e.g., 5 kilos, may kumot, etc.">
                </div>

                <button type="submit" class="btn-book" id="submitBtn">📅 Submit Booking</button>
                <div class="error" id="errorMsg"></div>
            </form>

            <div class="success" id="successBox">
                <div class="check">✓</div>
                <h3>Booking Received!</h3>
                <p>We'll call you shortly to confirm the pickup.</p>
                <div class="booking-id" id="bookingIdDisplay">#B000</div>
                <p style="font-size:12px;">Please keep this booking number for reference.</p>
                <a href="/login.html" class="btn-book" style="display:block; text-decoration:none; text-align:center; margin-top:16px;">← Back to Home</a>
            </div>

            <div class="call-box" id="callBox">
                📞 Prefer to call? Just dial our shop
            </div>

            <a href="/login.html" class="back-link">← Back to Login</a>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('pickupDate').min = today;
        document.getElementById('pickupDate').value = today;

        fetch('/api/services/public')
            .then(res => res.json())
            .then(services => {
                const sel = document.getElementById('serviceType');
                if (Array.isArray(services)) {
                    services.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.name;
                        opt.textContent = s.name;
                        sel.appendChild(opt);
                    });
                }
            })
            .catch(() => {});
    });

    function submitBooking(e) {
        e.preventDefault();
        const errorMsg = document.getElementById('errorMsg');
        const btn = document.getElementById('submitBtn');
        errorMsg.style.display = 'none';

        const customer_name = document.getElementById('customerName').value.trim();
        const customer_phone = document.getElementById('customerPhone').value.trim();
        const customer_address = document.getElementById('customerAddress').value.trim();
        const service_type = document.getElementById('serviceType').value;
        const preferred_date = document.getElementById('pickupDate').value;
        const preferred_time = document.getElementById('pickupTime').value;
        const notes = document.getElementById('bookingNotes').value.trim();

        if (!/^09\d{9}$/.test(customer_phone)) {
            errorMsg.innerText = 'Cellphone must be 11 digits starting with 09';
            errorMsg.style.display = 'block';
            return;
        }

        btn.innerText = 'Submitting...';
        btn.disabled = true;

        fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customer_name, customer_phone, customer_address, service_type, preferred_date, preferred_time, notes })
        })
        .then(res => res.json())
        .then(data => {
            btn.innerText = '📅 Submit Booking';
            btn.disabled = false;
            if (data.error) {
                errorMsg.innerText = data.error;
                errorMsg.style.display = 'block';
                return;
            }
            document.getElementById('bookingForm').style.display = 'none';
            document.getElementById('callBox').style.display = 'none';
            document.getElementById('successBox').style.display = 'block';
            document.getElementById('bookingIdDisplay').innerText = '#B' + String(data.booking.id).padStart(4, '0');
        })
        .catch(() => {
            btn.innerText = '📅 Submit Booking';
            btn.disabled = false;
            errorMsg.innerText = 'Connection error. Please try again.';
            errorMsg.style.display = 'block';
        });
    }
</script>
</body>
</html>
