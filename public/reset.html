<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .card-box { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 100%; max-width: 440px; }
        .logo-img { text-align: center; margin-bottom: 15px; }
        .logo-img img { max-width: 140px; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 5px; font-weight: 700; font-size: 22px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 25px; }
        .btn-primary-custom { background: #1e40af; color: white; border: none; padding: 12px; font-weight: 600; width: 100%; border-radius: 8px; }
        .btn-primary-custom:hover { background: #1e3a8a; color: white; }
        .error { color: #dc2626; text-align: center; margin-top: 12px; font-size: 14px; display: none; }
        .success { color: #065f46; text-align: center; margin-top: 12px; font-size: 14px; display: none; background: #d1fae5; padding: 12px; border-radius: 8px; }
        .form-label { font-size: 13px; color: #475569; font-weight: 500; }
        .warning { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="card-box">
        <div class="logo-img"><img src="/logo.png" alt="Hawi's Lovada" onerror="this.style.display='none'"></div>
        <h2>Set New Password</h2>
        <p class="subtitle">Choose a new password for your account</p>

        <div id="invalidBox" class="warning" style="display: none;">
            ⚠️ This reset link is invalid or has expired.<br>
            <a href="/forgot.html" style="color:#92400e; font-weight:600;">Request a new one →</a>
        </div>

        <div id="formBox" style="display: none;">
            <form onsubmit="resetPassword(event)">
                <div class="mb-3">
                    <label class="form-label">New Password (min 6 chars)</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter new password" required autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" id="password2" class="form-control" placeholder="Repeat new password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary-custom" id="submitBtn">✅ Set New Password</button>
                <div class="error" id="errorMsg"></div>
                <div class="success" id="successMsg"></div>
            </form>
        </div>

        <a href="/login.html" class="d-block text-center mt-3" style="color:#64748b; font-size:13px;">← Back to login</a>
    </div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
        document.getElementById('invalidBox').style.display = 'block';
    } else {
        document.getElementById('formBox').style.display = 'block';
    }

    function resetPassword(e) {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const btn = document.getElementById('submitBtn');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (password.length < 6) {
            errorMsg.innerText = 'Password must be at least 6 characters.';
            errorMsg.style.display = 'block';
            return;
        }
        if (password !== password2) {
            errorMsg.innerText = 'Passwords do not match.';
            errorMsg.style.display = 'block';
            return;
        }

        btn.innerText = 'Saving...';
        btn.disabled = true;

        fetch('/api/auth/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                successMsg.innerText = '✅ Password updated! Redirecting to login...';
                successMsg.style.display = 'block';
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            } else {
                errorMsg.innerText = data.error || 'Reset failed.';
                errorMsg.style.display = 'block';
                btn.innerText = '✅ Set New Password';
                btn.disabled = false;
            }
        })
        .catch(() => {
            errorMsg.innerText = 'Connection error. Try again.';
            errorMsg.style.display = 'block';
            btn.innerText = '✅ Set New Password';
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
