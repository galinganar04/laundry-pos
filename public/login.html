<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hawi's Lovada - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 100%; max-width: 420px; }
        .logo-img { text-align: center; margin-bottom: 15px; }
        .logo-img img { max-width: 180px; height: auto; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 5px; font-weight: bold; }
        .tagline { text-align: center; color: #dc2626; font-style: italic; font-size: 13px; margin-bottom: 25px; }
        .btn-login { background: #1e40af; color: white; border: none; padding: 12px; font-weight: bold; width: 100%; border-radius: 8px; margin-top: 10px; }
        .btn-login:hover { background: #1e3a8a; color: white; }
        .error { color: #dc2626; text-align: center; margin-top: 12px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-img"><img src="/logo.png" alt="Hawi's Lovada Laundry Shop"></div>
        <h2>Hawi's Lovada</h2>
        <p class="tagline">Laundry Shop — Clean. Fresh. Wash with Love.</p>
        <form onsubmit="login(event)">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password" autofocus required>
            <button type="submit" class="btn-login">🔓 Log In</button>
            <div class="error" id="errorMsg">Wrong password. Try again.</div>
        </form>
    </div>

<script>
    if (localStorage.getItem('authToken')) { window.location.href = '/'; }

    function login(e) {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.style.display = 'none';
        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) { localStorage.setItem('authToken', data.token); window.location.href = '/'; }
            else { errorMsg.style.display = 'block'; }
        })
        .catch(() => { errorMsg.innerText = 'Connection error. Try again.'; errorMsg.style.display = 'block'; });
    }
</script>
</body>
</html>
