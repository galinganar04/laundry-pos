<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hawi's Lovada - Login</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hawi's POS">
    <link rel="apple-touch-icon" href="/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .login-wrap {
            width: 100%;
            max-width: 400px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .logo-wrap {
            text-align: center;
            margin-bottom: 16px;
        }
        .logo-wrap img {
            max-width: 140px;
            height: auto;
        }
        h2 {
            text-align: center;
            color: #1e3a8a;
            margin: 0 0 4px 0;
            font-weight: 700;
            font-size: 22px;
        }
        .tagline {
            text-align: center;
            color: #dc2626;
            font-style: italic;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .form-label {
            font-size: 13px;
            color: #475569;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 16px; /* Prevents iOS zoom on focus */
            transition: all 0.15s;
        }
        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .btn-login {
            background: #1e40af;
            color: white;
            border: none;
            padding: 14px;
            font-weight: 600;
            width: 100%;
            border-radius: 10px;
            margin-top: 16px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-login:hover { background: #1e3a8a; color: white; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            display: none;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
        }
        .small-link {
            text-align: center;
            display: block;
            margin-top: 16px;
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }
        .small-link:hover { color: #1e40af; text-decoration: underline; }
        .signup-banner {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            color: #1e40af;
            margin-bottom: 16px;
            text-align: center;
        }
        .signup-banner a {
            color: #1e40af;
            font-weight: 700;
            text-decoration: underline;
        }
        @media (max-width: 400px) {
            .login-card { padding: 24px 18px; }
            .logo-wrap img { max-width: 110px; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="logo-wrap">
                <img src="/logo.png" alt="Hawi's Lovada" onerror="this.style.display='none'">
            </div>
            <h2>Hawi's Lovada</h2>
            <p class="tagline">Clean. Fresh. Wash with Love.</p>

            <div id="signupBanner" class="signup-banner" style="display: none;">
                🎉 No users yet. <a href="/signup.html">Create the owner account →</a>
            </div>

            <form onsubmit="login(event)">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" autofocus required autocomplete="username" autocapitalize="none">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="loginBtn">🔓 Log In</button>
                <div class="error" id="errorMsg"></div>
            </form>

            <a href="/forgot.html" class="small-link">Forgot your password?</a>
        </div>
    </div>

<script>
    if (localStorage.getItem('authToken')) { window.location.href = '/'; }

    fetch('/api/auth/signup-status')
        .then(res => res.json())
        .then(data => {
            if (data.open) document.getElementById('signupBanner').style.display = 'block';
        })
        .catch(() => {});

    function login(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        const btn = document.getElementById('loginBtn');
        errorMsg.style.display = 'none';
        btn.innerText = 'Logging in...';
        btn.disabled = true;

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                localStorage.setItem('authToken', data.token);
                if (data.user) {
                    localStorage.setItem('userName', data.user.full_name || data.user.username);
                    localStorage.setItem('userRole', data.user.role);
                }
                window.location.href = '/';
            } else {
                errorMsg.innerText = data.error || 'Login failed';
                errorMsg.style.display = 'block';
                btn.innerText = '🔓 Log In';
                btn.disabled = false;
            }
        })
        .catch(() => {
            errorMsg.innerText = 'Connection error. Try again.';
            errorMsg.style.display = 'block';
            btn.innerText = '🔓 Log In';
            btn.disabled = false;
        });
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        });
    }
</script>
</body>
</html>
