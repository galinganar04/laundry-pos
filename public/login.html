<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hawi's Lovada - Login</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hawi's POS">
    <link rel="apple-touch-icon" href="/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }
        .login-wrap { width: 100%; max-width: 420px; }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .logo-wrap { text-align: center; margin-bottom: 14px; }
        .logo-wrap img { max-width: 130px; height: auto; }
        h2 {
            text-align: center;
            color: #1e3a8a;
            margin: 0 0 4px 0;
            font-weight: 700;
            font-size: 22px;
        }
        .tagline {
            text-align: center;
            color: #dc2626;
            font-style: italic;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .mode-toggle {
            display: flex;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 22px;
            border: 1px solid #e2e8f0;
        }
        .mode-toggle button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 10px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .mode-toggle button.active {
            background: #1e40af;
            color: white;
            box-shadow: 0 4px 12px rgba(30,64,175,0.25);
        }
        .mode-toggle button:not(.active):hover {
            background: #e2e8f0;
            color: #1e40af;
        }

        .form-label {
            font-size: 12px;
            color: #475569;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 15px;
            transition: all 0.15s;
        }
        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .btn-login {
            background: #1e40af;
            color: white;
            border: none;
            padding: 14px;
            font-weight: 600;
            width: 100%;
            border-radius: 10px;
            margin-top: 16px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-login:hover { background: #1e3a8a; color: white; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            display: none;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
        }
        .small-link {
            text-align: center;
            display: block;
            margin-top: 16px;
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }
        .small-link:hover { color: #1e40af; text-decoration: underline; }
        .signup-banner {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            color: #1e40af;
            margin-bottom: 16px;
            text-align: center;
        }
        .signup-banner a { color: #1e40af; font-weight: 700; text-decoration: underline; }

        .customer-actions {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s;
        }
        .action-btn.track {
            background: #eff6ff;
            color: #1e40af;
            border: 2px solid #bfdbfe;
        }
        .action-btn.track:hover {
            background: #1e40af;
            color: white;
            border-color: #1e40af;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(30,64,175,0.2);
        }
        .action-btn.book {
            background: #ecfdf5;
            color: #065f46;
            border: 2px solid #a7f3d0;
        }
        .action-btn.book:hover {
            background: #10b981;
            color: white;
            border-color: #10b981;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16,185,129,0.2);
        }
        .action-btn .arrow { font-size: 18px; }

        .customer-panel h3 {
            text-align: center;
            color: #1e3a8a;
            font-size: 18px;
            font-weight: 800;
            margin: 0 0 6px;
        }
        .customer-panel .desc {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .back-to-login {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }
        .back-to-login a { color: #1e40af; font-weight: 700; cursor: pointer; text-decoration: none; }
        .back-to-login a:hover { text-decoration: underline; }

        @media (max-width: 400px) {
            .login-card { padding: 22px 18px; }
            .logo-wrap img { max-width: 105px; }
            h2 { font-size: 20px; }
            .mode-toggle button { font-size: 12px; padding: 10px 6px; }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="logo-wrap">
                <img src="/logo.png" alt="Hawi's Lovada" onerror="this.style.display='none'">
            </div>
            <h2>Hawi's Lovada</h2>
            <p class="tagline">Clean. Fresh. Wash with Love.</p>

            <div class="mode-toggle">
                <button id="tabEmployee" class="active" onclick="switchMode('employee')">👤 Employee</button>
                <button id="tabCustomer" onclick="switchMode('customer')">📦 Customer</button>
            </div>

            <div id="employeePanel">
                <div id="signupBanner" class="signup-banner" style="display: none;">
                    🎉 No users yet. <a href="/signup.html">Create the owner account →</a>
                </div>

                <form onsubmit="login(event)">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter username" autocomplete="username" autocapitalize="none">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter password" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-login" id="loginBtn">🔓 Log In</button>
                    <div class="error" id="errorMsg"></div>
                </form>

                <a href="/forgot.html" class="small-link">Forgot your password?</a>
            </div>

            <div id="customerPanel" style="display: none;">
                <div class="customer-panel">
                    <h3>Welcome!</h3>
                    <p class="desc">Track your laundry or book a pickup — no login needed</p>

                    <div class="customer-actions">
                        <a href="/track.html" class="action-btn track">
                            <span>📦 Track Your Order</span>
                            <span class="arrow">→</span>
                        </a>
                        <a href="/book.html" class="action-btn book">
                            <span>📅 Book a Pickup</span>
                            <span class="arrow">→</span>
                        </a>
                    </div>
                </div>

                <div class="back-to-login">
                    Are you an employee? <a onclick="switchMode('employee')">Log in here →</a>
                </div>
            </div>
        </div>
    </div>

<script>
    if (localStorage.getItem('authToken')) { window.location.href = '/'; }

    fetch('/api/auth/signup-status')
        .then(res => res.json())
        .then(data => {
            if (data.open) document.getElementById('signupBanner').style.display = 'block';
        })
        .catch(() => {});

    function switchMode(mode) {
        const employee = document.getElementById('employeePanel');
        const customer = document.getElementById('customerPanel');
        const tabEmployee = document.getElementById('tabEmployee');
        const tabCustomer = document.getElementById('tabCustomer');

        if (mode === 'employee') {
            employee.style.display = 'block';
            customer.style.display = 'none';
            tabEmployee.classList.add('active');
            tabCustomer.classList.remove('active');
            setTimeout(() => document.getElementById('username').focus(), 100);
        } else {
            employee.style.display = 'none';
            customer.style.display = 'block';
            tabEmployee.classList.remove('active');
            tabCustomer.classList.add('active');
        }
    }

    function login(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        const btn = document.getElementById('loginBtn');
        errorMsg.style.display = 'none';
        btn.innerText = 'Logging in...';
        btn.disabled = true;

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                localStorage.setItem('authToken', data.token);
                if (data.user) {
                    localStorage.setItem('userName', data.user.full_name || data.user.username);
                    localStorage.setItem('userRole', data.user.role);
                }
                window.location.href = '/';
            } else {
                errorMsg.innerText = data.error || 'Login failed';
                errorMsg.style.display = 'block';
                btn.innerText = '🔓 Log In';
                btn.disabled = false;
            }
        })
        .catch(() => {
            errorMsg.innerText = 'Connection error. Try again.';
            errorMsg.style.display = 'block';
            btn.innerText = '🔓 Log In';
            btn.disabled = false;
        });
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        });
    }
</script>
</body>
</html>
