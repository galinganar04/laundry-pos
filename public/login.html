<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }
        .logo-img { text-align: center; margin-bottom: 15px; }
        .logo-img img { max-width: 160px; height: auto; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 5px; font-weight: 700; }
        .tagline { text-align: center; color: #dc2626; font-style: italic; font-size: 13px; margin-bottom: 25px; }
        .btn-login { background: #1e40af; color: white; border: none; padding: 12px; font-weight: 600; width: 100%; border-radius: 8px; margin-top: 10px; font-size: 15px; }
        .btn-login:hover { background: #1e3a8a; color: white; }
        .error { color: #dc2626; text-align: center; margin-top: 12px; font-size: 14px; display: none; }
        .small-link { text-align: center; display: block; margin-top: 15px; color: #64748b; font-size: 13px; text-decoration: none; }
        .small-link:hover { color: #1e40af; text-decoration: underline; }
        .form-label { font-size: 13px; color: #475569; font-weight: 500; }
        .signup-banner { background: #dbeafe; border: 1px solid #93c5fd; border-radius: 8px; padding: 12px; font-size: 13px; color: #1e40af; margin-bottom: 15px; text-align: center; }
        .signup-banner a { color: #1e40af; font-weight: 700; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-img"><img src="/logo.png" alt="Hawi's Lovada" onerror="this.style.display='none'"></div>
        <h2>Hawi's Lovada</h2>
        <p class="tagline">Laundry Shop — Clean. Fresh. Wash with Love.</p>

        <div id="signupBanner" class="signup-banner" style="display: none;">
            🎉 No users yet. <a href="/signup.html">Create the owner account →</a>
        </div>

        <form onsubmit="login(event)">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" autofocus required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">🔓 Log In</button>
            <div class="error" id="errorMsg"></div>
        </form>

        <a href="/forgot.html" class="small-link">Forgot your password?</a>
    </div>

<script>
    // If already logged in, go to POS
    if (localStorage.getItem('authToken')) { window.location.href = '/'; }

    // Check if signup is open
    fetch('/api/auth/signup-status')
        .then(res => res.json())
        .then(data => {
            if (data.open) document.getElementById('signupBanner').style.display = 'block';
        })
        .catch(() => {});

    function login(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        const btn = document.getElementById('loginBtn');
        errorMsg.style.display = 'none';
        btn.innerText = 'Logging in...';
        btn.disabled = true;

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                localStorage.setItem('authToken', data.token);
                if (data.user) {
                    localStorage.setItem('userName', data.user.full_name || data.user.username);
                    localStorage.setItem('userRole', data.user.role);
                }
                window.location.href = '/';
            } else {
                errorMsg.innerText = data.error || 'Login failed';
                errorMsg.style.display = 'block';
                btn.innerText = '🔓 Log In';
                btn.disabled = false;
            }
        })
        .catch(() => {
            errorMsg.innerText = 'Connection error. Try again.';
            errorMsg.style.display = 'block';
            btn.innerText = '🔓 Log In';
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
