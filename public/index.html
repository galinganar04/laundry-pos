<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hawi's Lovada - POS</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hawi's POS">
    <link rel="apple-touch-icon" href="/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; padding-bottom: 20px; }

        /* TOP BAR (mobile) */
        .topbar {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .topbar .logo-img {
            height: 38px;
            width: auto;
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
            padding: 4px;
        }
        .topbar .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
        }
        .topbar .user-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .topbar .icon-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .topbar .icon-btn:hover { background: rgba(255,255,255,0.25); color: white; }

        /* DESKTOP SIDEBAR */
        .sidebar {
            background-color: #1e293b;
            color: white;
            min-height: 100vh;
            padding-top: 20px;
        }
        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            font-size: 14px;
            border-radius: 6px;
            margin: 2px 10px;
        }
        .sidebar a:hover { background-color: rgba(59,130,246,0.15); color: white; }
        .sidebar a.active { background-color: #3b82f6; color: white; }

        /* MAIN CONTENT */
        .main-content { padding: 16px; }
        .page-title { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 14px; }
        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            font-weight: 700;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            margin-bottom: 12px;
        }
        .search-input:focus { outline: none; border-color: #3b82f6; }

        /* SERVICE CARDS */
        .service-card {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background: white;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            transition: 0.2s;
        }
        .service-card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.12); }
        .service-card.selected { outline: 3px solid #10b981; outline-offset: -3px; }
        .service-thumb {
            height: 110px;
            width: 100%;
            position: relative;
            background: #0f172a;
        }
        .service-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }
        .service-thumb .overlay {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 8px;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 100%);
            color: white;
            text-align: center;
        }
        .service-thumb .name { font-weight: 800; font-size: 12px; text-transform: uppercase; }
        .service-thumb .price { font-weight: 800; font-size: 13px; margin-top: 2px; }
        .service-card .qty-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #10b981;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            display: none;
        }
        .service-card.selected .qty-badge { display: block; }

        /* ADD-ON CARDS */
        .addon-card {
            cursor: pointer;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: white;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            transition: 0.2s;
            position: relative;
        }
        .addon-card:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .addon-card.selected { border-color: #10b981; border-width: 2px; }
        .addon-thumb {
            width: 48px; height: 48px;
            border-radius: 8px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .addon-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .addon-name { font-weight: 700; color: #1e293b; text-transform: uppercase; font-size: 13px; }
        .addon-meta { font-size: 11px; color: #94a3b8; }
        .addon-price { font-weight: 700; color: #1e40af; font-size: 14px; }
        .addon-card .qty-badge {
            background: #10b981;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            display: none;
        }
        .addon-card.selected .qty-badge { display: inline-block; }

        /* CART PANEL */
        .cart-panel {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-top: 8px;
        }
        .cart-panel h5 {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }
        .cart-empty { color: #94a3b8; text-align: center; font-size: 13px; padding: 12px 0; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
        }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name { font-weight: 600; color: #1e293b; font-size: 13px; }
        .cart-item-sub { font-size: 11px; color: #94a3b8; }
        .qty-controls { display: flex; align-items: center; gap: 6px; }
        .qty-btn {
            border: 1px solid #e2e8f0;
            background: white;
            width: 30px; height: 30px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            color: #475569;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .qty-btn:hover { background: #f1f5f9; }
        .cart-item-price { font-weight: 700; color: #1e40af; min-width: 70px; text-align: right; flex-shrink: 0; }

        .form-label {
            font-size: 12px;
            color: #475569;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control, .form-select {
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            width: 100%;
        }
        .form-control:focus, .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            font-weight: 700;
            font-size: 18px;
            color: #1e293b;
            border-top: 2px solid #e2e8f0;
            margin-top: 8px;
        }

        .btn-checkout {
            background: #1e40af;
            color: white;
            width: 100%;
            padding: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-checkout:hover { background: #1e3a8a; color: white; }
        .btn-checkout:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-print {
            background: #10b981;
            color: white;
            width: 100%;
            padding: 14px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
        }
        .btn-print:hover { background: #059669; color: white; }
        .btn-print-80 { background: #0891b2; }
        .btn-print-80:hover { background: #0e7490; }
        .print-buttons { display: none; }

        /* DARK MODE */
        [data-theme="dark"] body { background-color: #0f172a !important; color: #e2e8f0 !important; }
        [data-theme="dark"] .sidebar { background-color: #020617 !important; }
        [data-theme="dark"] .sidebar a { color: #94a3b8 !important; }
        [data-theme="dark"] .sidebar a.active { background-color: #1e40af !important; color: white !important; }
        [data-theme="dark"] .cart-panel, [data-theme="dark"] .addon-card, [data-theme="dark"] .service-card { background-color: #1e293b !important; color: #e2e8f0 !important; }
        [data-theme="dark"] .page-title, [data-theme="dark"] .addon-name, [data-theme="dark"] .cart-item-name { color: #e2e8f0 !important; }
        [data-theme="dark"] .form-control, [data-theme="dark"] .form-select, [data-theme="dark"] .search-input { background-color: #334155 !important; border-color: #475569 !important; color: #e2e8f0 !important; }
        [data-theme="dark"] .text-muted { color: #94a3b8 !important; }
        [data-theme="dark"] .addon-thumb { background: #334155; }
        [data-theme="dark"] .qty-btn { background: #334155; border-color: #475569; color: #cbd5e1; }
        [data-theme="dark"] .cart-item { border-color: #334155; }
        [data-theme="dark"] .cart-total-row { color: #e2e8f0; border-color: #334155; }
        [data-theme="dark"] .section-label { color: #64748b; }
        [data-theme="dark"] .section-label::after { background: #334155; }
        [data-theme="dark"] .cart-panel h5 { border-color: #334155; }

        /* RESPONSIVE */
        @media (max-width: 767px) {
            .desktop-sidebar { display: none !important; }

            /* Remove all scroll blockers */
            html, body {
                height: auto !important;
                overflow-x: hidden !important;
                overflow-y: auto !important;
            }
            .container-fluid, .row {
                overflow: visible !important;
                height: auto !important;
            }

            .main-content { padding: 12px; }

            /* Full-width stacking for mobile */
            .col-md-7, .col-md-3, .col-md-2 {
                width: 100% !important;
                max-width: 100% !important;
                flex: 0 0 100% !important;
                padding-left: 10px !important;
                padding-right: 10px !important;
            }

            .desktop-cart-col { margin-top: 6px; }

            .cart-panel {
                position: static !important;
                margin-top: 12px;
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
            }

            .service-thumb { height: 100px; }
            .service-thumb .name { font-size: 11px; }
            .service-thumb .price { font-size: 12px; }

            /* Bigger touch targets */
            .btn-checkout { padding: 18px; font-size: 17px; }
            .btn-print { padding: 16px; font-size: 15px; }
            .qty-btn { width: 34px; height: 34px; font-size: 17px; }
            .form-control, .form-select { padding: 14px; font-size: 16px; }
        }

        @media (min-width: 768px) {
            .topbar { display: none; }
            .desktop-sidebar { display: block; }
            .main-content { padding: 24px; }
            .service-thumb { height: 140px; }
            .service-thumb .name { font-size: 13px; }
            .service-thumb .price { font-size: 14px; }
            .desktop-cart-col .cart-panel { position: sticky; top: 20px; }
        }
    </style>
</head>
<body>

<!-- TOP BAR (mobile) -->
<div class="topbar d-md-none">
    <img src="/logo.png" alt="Hawi's Lovada" class="logo-img" onerror="this.style.display='none'">
    <div class="user-info">
        <a href="/orders.html" class="icon-btn" title="Orders">📋</a>
        <span class="user-badge">👤 <span id="currentUserMobile">—</span></span>
        <button class="icon-btn" onclick="logout()" title="Logout">🚪</button>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <!-- DESKTOP SIDEBAR -->
        <div class="col-md-2 sidebar desktop-sidebar d-none d-md-block">
            <div class="text-center mb-4">
                <img src="/logo.png" alt="Hawi's Lovada" style="max-width: 130px; height: auto;" onerror="this.style.display='none'">
            </div>
            <a href="/" class="active">🧺 POS</a>
            <a href="/dashboard.html">📊 Dashboard</a>
            <a href="/services.html">🧴 Services</a>
            <a href="/products.html">📦 Products</a>
            <a href="/orders.html">📋 Orders</a>
            <a href="/replenishments.html">📥 Replenishments</a>
            <a href="/expenses.html">💰 Expenses</a>
            <a href="/customers.html">👥 Customers</a>
            <a href="/settings.html">⚙️ Settings</a>
            <a href="#" class="theme-toggle">🌙 Dark Mode</a>
            <a href="#" onclick="logout()">🚪 Logout</a>
        </div>

        <!-- SERVICES + ADD-ONS -->
        <div class="col-md-7 main-content">
            <div class="d-none d-md-flex justify-content-between align-items-center mb-3">
                <h3 class="page-title mb-0">Point of Sale</h3>
                <div style="background: #dbeafe; color: #1e40af; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;">
                    👤 <span id="currentUserDesktop">—</span>
                </div>
            </div>

            <input type="text" class="search-input" id="searchBox" placeholder="🔍 Search services or add-ons...">

            <div class="section-label">🧴 Services</div>
            <div class="row" id="servicesContainer"></div>

            <div class="section-label">✨ Add-ons</div>
            <div class="row" id="addonsContainer"></div>
        </div>

        <!-- CART (mobile: below; desktop: right sticky column) -->
        <div class="col-md-3 main-content desktop-cart-col">
            <div class="cart-panel">
                <h5>🛒 Cart <span id="cartCount" class="badge bg-secondary">0 items</span></h5>
                <div id="cartItemsList" class="mb-3">
                    <p class="cart-empty">Cart is empty.</p>
                </div>

                <div class="mb-3">
                    <label class="form-label">👤 Customer</label>
                    <input type="text" id="customerName" class="form-control" value="Walk-In Customer" list="customerList" autocomplete="off">
                    <datalist id="customerList"></datalist>
                </div>

                <div class="mb-3">
                    <label class="form-label">💵 Payment</label>
                    <select id="paymentStatus" class="form-select">
                        <option value="Paid">💵 Pay Now</option>
                        <option value="Pending">⏳ Pay Later</option>
                    </select>
                </div>

                <div class="cart-total-row">
                    <span>Total</span>
                    <span id="cartTotal">₱0.00</span>
                </div>

                <button class="btn-checkout" id="checkoutBtn" onclick="checkout()">✅ Checkout</button>

                <div class="print-buttons" id="printButtons">
                    <button class="btn-print" onclick="printReceipt('58')">🖨️ Print 58mm</button>
                    <button class="btn-print btn-print-80" onclick="printReceipt('80')">🖨️ Print 80mm</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/role-guard.js"></script>
<script>
    const authToken = localStorage.getItem('authToken');
    const userName = localStorage.getItem('userName') || 'Unknown';
    document.getElementById('currentUserMobile').innerText = userName;
    document.getElementById('currentUserDesktop').innerText = userName;

    const isMobile = window.matchMedia('(max-width: 767px)').matches;

    let shopSettings = { shop_name: "Hawi's Lovada", tagline: 'Clean. Fresh. Wash with Love.', address: '', phone: '', facebook: '', tin: '', currency: '₱' };
    fetch('/api/settings', { headers: { 'x-auth-token': authToken } })
        .then(res => res.json()).then(data => { if (data) shopSettings = data; });

    fetch('/api/customers', { headers: { 'x-auth-token': authToken } })
        .then(res => res.json())
        .then(customers => {
            document.getElementById('customerList').innerHTML = customers.map(c => `<option value="${c.name}">${c.phone || ''}</option>`).join('');
        });

    let cart = [], total = 0, lastOrder = null;

    // Load Services
    fetch('/api/services', { headers: { 'x-auth-token': authToken } })
        .then(response => {
            if (response.status === 401) { localStorage.removeItem('authToken'); window.location.href = '/login.html'; return; }
            return response.json();
        })
        .then(services => {
            if (!services) return;
            const container = document.getElementById('servicesContainer');
            if (services.length === 0) { container.innerHTML = '<div class="col-12 text-center text-muted py-3">No services available.</div>'; return; }
            services.forEach(service => {
                const color = service.color || '#1e40af';
                const unit = service.unit_label || service.unit || 'kg';
                let inner;
                if (service.image_data) {
                    inner = `<div class="service-thumb"><img src="${service.image_data}"><div class="overlay"><div class="name">${service.name}</div><div class="price">₱${parseFloat(service.price).toFixed(2)} / ${unit}</div></div><div class="qty-badge" id="badge-${service.id}">0</div></div>`;
                } else {
                    inner = `<div class="service-thumb" style="background: ${color};"><div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 8px; text-align: center;"><div class="name">${service.name}</div><div class="price">₱${parseFloat(service.price).toFixed(2)} / ${unit}</div></div><div class="qty-badge" id="badge-${service.id}">0</div></div>`;
                }
                container.innerHTML += `<div class="col-6 col-md-4 mb-3"><div class="card service-card" id="svc-${service.id}" onclick="addToCart('${service.name.replace(/'/g, "\\'")}', ${service.price}, '${unit}', 'service', ${service.id})">${inner}</div></div>`;
            });
        });

    // Load Add-ons
    fetch('/api/products', { headers: { 'x-auth-token': authToken } })
        .then(res => res.json())
        .then(products => {
            const addons = (products || []).filter(p => p.stock > 0);
            const container = document.getElementById('addonsContainer');
            if (addons.length === 0) { container.innerHTML = '<div class="col-12 text-center text-muted py-3">No add-ons available.</div>'; return; }
            addons.forEach(p => {
                const thumb = p.image_data ? `<div class="addon-thumb"><img src="${p.image_data}"></div>` : `<div class="addon-thumb">${p.icon || '📦'}</div>`;
                container.innerHTML += `<div class="col-12 col-md-6"><div class="addon-card" id="prod-${p.id}" onclick="addToCart('${p.name.replace(/'/g, "\\'")}', ${p.selling_price || p.cost_price || 0}, 'pc', 'addon', 'p${p.id}')">${thumb}<div class="flex-grow-1"><div class="addon-name">${p.name}</div><div class="addon-meta">${p.category || 'General'} • ${p.stock} in stock</div></div><div class="text-end"><div class="addon-price">₱${parseFloat(p.selling_price || p.cost_price || 0).toFixed(2)}</div><div class="qty-badge" id="badge-p${p.id}">0</div></div></div></div>`;
            });
        });

    // Search filter
    document.getElementById('searchBox').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('#servicesContainer > div, #addonsContainer > div').forEach(el => {
            el.style.display = el.innerText.toLowerCase().includes(term) ? '' : 'none';
        });
    });

    function addToCart(name, price, unit, type, id) {
        const existingItem = cart.find(item => item.name === name);
        if (existingItem) existingItem.qty += 1;
        else cart.push({ name: name, price: parseFloat(price), unit: unit, qty: 1, type: type || 'service' });
        updateCartUI();

        if (id !== undefined) {
            const card = document.getElementById((type === 'addon' ? 'prod-' : 'svc-') + id);
            const badge = document.getElementById('badge-' + (type === 'addon' ? 'p' + id : id));
            if (card && badge) {
                const item = cart.find(i => i.name === name);
                card.classList.add('selected');
                badge.innerText = 'x' + item.qty;
            }
        }

        // On mobile: smoothly scroll to cart so the user sees the next steps
        if (isMobile) {
            setTimeout(() => {
                document.querySelector('.cart-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }
    }

    function increaseQty(name) {
        const i = cart.find(x => x.name === name);
        if (i) { i.qty += 1; updateCartUI(); updateBadge(name); }
    }
    function decreaseQty(name) {
        const i = cart.find(x => x.name === name);
        if (i) {
            i.qty -= 1;
            if (i.qty <= 0) cart = cart.filter(x => x.name !== name);
            updateCartUI();
            updateBadge(name);
        }
    }

    function updateBadge(name) {
        document.querySelectorAll('.qty-badge').forEach(b => { b.innerText = '0'; b.style.display = 'none'; });
        document.querySelectorAll('.service-card, .addon-card').forEach(c => c.classList.remove('selected'));

        cart.forEach(item => {
            document.querySelectorAll('.service-card, .addon-card').forEach(card => {
                const cardName = card.querySelector('.name, .card-title, .addon-name');
                if (cardName && cardName.innerText.trim() === item.name) {
                    card.classList.add('selected');
                    const badge = card.querySelector('.qty-badge');
                    if (badge) { badge.innerText = 'x' + item.qty; badge.style.display = 'block'; }
                }
            });
        });
    }

    function updateCartUI() {
        const list = document.getElementById('cartItemsList');
        const countSpan = document.getElementById('cartCount');
        const totalSpan = document.getElementById('cartTotal');

        list.innerHTML = ''; total = 0; let itemCount = 0;
        if (cart.length === 0) {
            list.innerHTML = '<p class="cart-empty">Cart is empty.</p>';
        } else {
            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal; itemCount += item.qty;
                list.innerHTML += `<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${item.name}</div><div class="cart-item-sub">₱${item.price.toFixed(2)} × ${item.qty}</div></div><div class="qty-controls"><button class="qty-btn" onclick="decreaseQty('${item.name.replace(/'/g, "\\'")}')">−</button><span style="font-weight:600; min-width:18px; text-align:center;">${item.qty}</span><button class="qty-btn" onclick="increaseQty('${item.name.replace(/'/g, "\\'")}')">+</button></div><div class="cart-item-price">₱${itemTotal.toFixed(2)}</div></div>`;
            });
        }
        countSpan.innerText = itemCount + ' items';
        totalSpan.innerText = '₱' + total.toFixed(2);
    }

    function checkout() {
        if (cart.length === 0) return alert("Cart is empty.");
        const customer = document.getElementById('customerName').value;
        const paymentStatus = document.getElementById('paymentStatus').value;
        const cashierName = localStorage.getItem('userName') || 'Unknown';
        const btn = document.getElementById('checkoutBtn');
        btn.innerText = 'Processing...'; btn.disabled = true;

        const receiptData = { customer, total, items: JSON.parse(JSON.stringify(cart)), date: new Date().toLocaleString(), paymentStatus };
        fetch('/api/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-auth-token': authToken },
            body: JSON.stringify({ customer, total, cartItems: cart, paymentStatus, cashierName })
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) { alert('Error: ' + data.error); btn.innerText = '✅ Checkout'; btn.disabled = false; return; }
            alert(data.message + ' (Cashier: ' + cashierName + ')');
            receiptData.orderId = data.orderId;
            lastOrder = receiptData;
            cart = [];
            updateCartUI();
            document.querySelectorAll('.qty-badge').forEach(b => { b.innerText = '0'; b.style.display = 'none'; });
            document.querySelectorAll('.service-card, .addon-card').forEach(c => c.classList.remove('selected'));
            btn.innerText = '✅ Checkout'; btn.disabled = false;
            document.getElementById('printButtons').style.display = 'block';
            document.getElementById('printButtons').scrollIntoView({ behavior: 'smooth', block: 'center' });
        })
        .catch(() => { alert("Error saving order."); btn.innerText = '✅ Checkout'; btn.disabled = false; });
    }

    function printReceipt(size) {
        if (!lastOrder) return alert("No recent order to print.");
        const isPaid = String(lastOrder.paymentStatus).toLowerCase() === 'paid';
        const statusLabel = isPaid ? '*** PAID ***' : '*** PAY ON PICKUP ***';
        const payNote = isPaid ? '' : 'Please pay upon pickup.';
        const fontSize = size === '58' ? 10 : 12;
        const pageWidth = size === '58' ? '58mm' : '80mm';
        const logoSrc = window.location.origin + '/logo.png';
        const cur = shopSettings.currency || '₱';
        const customerName = (lastOrder.customer || 'Walk-In Customer').toUpperCase();

        const itemsCustomerHtml = lastOrder.items.map(item => {
            const nameTrunc = item.name.length > (size === '58' ? 16 : 28) ? item.name.substring(0, size === '58' ? 15 : 27) + '.' : item.name;
            return `<tr><td style="padding:2px 0;">${nameTrunc}</td><td style="text-align:center;">${item.qty}</td><td style="text-align:right;">${cur}${(item.price * item.qty).toFixed(2)}</td></tr>`;
        }).join('');

        const itemsShopHtml = lastOrder.items.map(item => {
            const nameTrunc = item.name.length > (size === '58' ? 20 : 32) ? item.name.substring(0, size === '58' ? 19 : 31) + '.' : item.name;
            return `<tr><td style="padding:2px 0;">${nameTrunc}</td><td style="text-align:center;">${item.qty}</td></tr>`;
        }).join('');

        const customerCopyHtml = `
            <div class="receipt-copy">
                <div class="logo"><img src="${logoSrc}" alt="${shopSettings.shop_name}"></div>
                <div class="center big bold">${shopSettings.shop_name.toUpperCase()}</div>
                <div class="center" style="font-size: ${fontSize - 1}px;">${shopSettings.tagline || ''}</div>
                <div class="divider-solid"></div>
                <div class="info">Order #: <span class="bold">${lastOrder.orderId}</span></div>
                <div class="info">Date: ${lastOrder.date}</div>
                <div class="info">Customer: ${lastOrder.customer}</div>
                <div class="divider"></div>
                <table><thead><tr style="border-bottom: 1px solid #000;"><th style="text-align:left;">Item</th><th style="text-align:center;">Qty</th><th style="text-align:right;">Amount</th></tr></thead><tbody>${itemsCustomerHtml}</tbody></table>
                <table><tr class="total-row"><td>TOTAL</td><td style="text-align:right;">${cur}${lastOrder.total.toFixed(2)}</td></tr></table>
                <div class="divider"></div>
                <div class="status">${statusLabel}</div>
                ${payNote ? `<div class="center">${payNote}</div>` : ''}
                <div class="divider"></div>
                <div class="center big bold customer-name">${customerName}</div>
                <div class="divider-solid"></div>
                <div class="footer">Thank you for your business!</div>
            </div>
        `;

        const shopCopyHtml = `
            <div class="receipt-copy shop-copy">
                <div class="copy-label">SHOP COPY</div>
                <div class="logo"><img src="${logoSrc}" alt="${shopSettings.shop_name}"></div>
                <div class="center big bold">${shopSettings.shop_name.toUpperCase()}</div>
                <div class="center" style="font-size: ${fontSize - 1}px;">${shopSettings.tagline || ''}</div>
                <div class="center big bold customer-name">${customerName}</div>
                <div class="divider-solid"></div>
                <div class="info">Order #: <span class="bold">${lastOrder.orderId}</span></div>
                <div class="info">Date: ${lastOrder.date}</div>
                <div class="divider"></div>
                <table><thead><tr style="border-bottom: 1px solid #000;"><th style="text-align:left;">Item</th><th style="text-align:center;">Qty</th></tr></thead><tbody>${itemsShopHtml}</tbody></table>
                <div class="divider"></div>
                <div class="status">${statusLabel}</div>
                ${payNote ? `<div class="center">${payNote}</div>` : ''}
                <div class="divider-solid"></div>
                <div class="footer">Thank you for your business!</div>
            </div>
        `;

        const receiptHtml = `<!DOCTYPE html><html><head><title>Receipt #${lastOrder.orderId}</title>
            <style>
                @page { size: ${pageWidth} auto; margin: 0; }
                body { font-family: 'Courier New', monospace; font-size: ${fontSize}px; width: ${pageWidth}; max-width: ${pageWidth}; margin: 0 auto; padding: 5px; font-weight: 600; line-height: 1.3; color: #000; background: #fff; }
                .receipt-copy { padding-bottom: 10px; }
                .receipt-copy.shop-copy { border-top: 2px dashed #000; padding-top: 12px; margin-top: 10px; }
                .copy-label { text-align: center; font-weight: 900; background: #000; color: #fff; padding: 4px; margin-bottom: 8px; font-size: ${fontSize + 1}px; letter-spacing: 2px; }
                .center { text-align: center; }
                .bold { font-weight: 900; }
                .big { font-size: ${size === '58' ? 14 : 16}px; }
                .customer-name { margin-top: 2px; margin-bottom: 4px; }
                .divider { border-top: 1px dashed #000; margin: 4px 0; }
                .divider-solid { border-top: 2px solid #000; margin: 6px 0; }
                .logo { text-align: center; margin-bottom: 3px; }
                .logo img { max-width: ${size === '58' ? '60px' : '80px'}; height: auto; filter: grayscale(100%); }
                table { width: 100%; border-collapse: collapse; }
                .total-row { font-weight: 900; font-size: ${size === '58' ? 12 : 14}px; padding-top: 4px; }
                .status { text-align: center; font-weight: 900; padding: 4px; border: 2px solid #000; margin: 5px 0; color: #000; background: #fff; }
                .footer { text-align: center; font-size: ${fontSize - 1}px; margin-top: 8px; }
                .info { font-size: ${fontSize}px; margin: 2px 0; }
                .print-btn { display: block; margin: 15px auto; padding: 10px 20px; font-size: 14px; cursor: pointer; background: #000; color: white; border: none; border-radius: 5px; font-family: Arial, sans-serif; }
                @media print {
                    .print-btn { display: none; }
                    body { padding: 2mm; }
                    * { color: #000 !important; background: #fff !important; }
                }
            </style></head><body>
                ${customerCopyHtml}
                ${shopCopyHtml}
                <br><br><br>
                <button class="print-btn" onclick="window.print()">🖨️ Print Both Copies</button>
            </body></html>`;
        const w = window.open('', '_blank', 'width=400,height=700');
        w.document.write(receiptHtml);
        w.document.close();
    }

    function logout() {
        const token = localStorage.getItem('authToken');
        if (token) fetch('/api/logout', { method: 'POST', headers: { 'x-auth-token': token } });
        localStorage.removeItem('authToken');
        localStorage.removeItem('userName');
        localStorage.removeItem('userRole');
        window.location.href = '/login.html';
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        });
    }
</script>
<script src="/theme.js"></script>
</body>
</html>
