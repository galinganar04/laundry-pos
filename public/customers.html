<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hawi's Lovada - Customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #1e293b; color: white; min-height: 100vh; padding-top: 20px; }
        .sidebar h4 { color: #60a5fa; }
        .sidebar a { color: #cbd5e1; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #3b82f6; color: white; border-radius: 5px; }
        .panel { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        [data-theme="dark"] body { background-color: #0f172a !important; color: #e2e8f0 !important; }
        [data-theme="dark"] .sidebar { background-color: #020617 !important; }
        [data-theme="dark"] .sidebar h4 { color: #60a5fa !important; }
        [data-theme="dark"] .sidebar a { color: #94a3b8 !important; }
        [data-theme="dark"] .sidebar a:hover, [data-theme="dark"] .sidebar a.active { background-color: #1e40af !important; color: white !important; }
        [data-theme="dark"] .panel { background-color: #1e293b !important; color: #e2e8f0 !important; }
        [data-theme="dark"] .table { color: #e2e8f0 !important; }
        [data-theme="dark"] .table th { color: #cbd5e1 !important; border-color: #334155 !important; }
        [data-theme="dark"] .table td { border-color: #334155 !important; }
        [data-theme="dark"] .table-hover > tbody > tr:hover > * { background-color: rgba(59,130,246,0.15) !important; }
        [data-theme="dark"] .form-control { background-color: #334155 !important; border-color: #475569 !important; color: #e2e8f0 !important; }
        [data-theme="dark"] .form-control::placeholder { color: #94a3b8 !important; }
        [data-theme="dark"] .text-muted { color: #94a3b8 !important; }
        [data-theme="dark"] .modal-content { background-color: #1e293b !important; color: #e2e8f0 !important; }
        [data-theme="dark"] .modal-header { border-color: #334155 !important; }
        [data-theme="dark"] .alert-info { background-color: #1e3a8a !important; color: #bfdbfe !important; border-color: #1e40af !important; }
        [data-theme="dark"] h3, [data-theme="dark"] h5 { color: #e2e8f0 !important; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-none d-md-block">
            <h4 class="text-center mb-4">Hawi's Lovada</h4>
            <a href="/">🧺 POS</a>
            <a href="/dashboard.html">📊 Dashboard</a>
            <a href="/reports.html">📈 Reports</a>
            <a href="/orders.html">📋 Orders</a>
            <a href="/customers.html" class="active">👥 Customers</a>
            <a href="/services.html">🧴 Services</a>
            <a href="#" class="theme-toggle">🌙 Dark Mode</a>
            <a href="#" onclick="logout()">🚪 Logout</a>
        </div>

        <div class="col-md-10 p-4">
            <h3 class="mb-4">Customer Registry</h3>
            <div class="panel mb-4">
                <h5>Add New Customer</h5>
                <div class="row g-2 mt-2">
                    <div class="col-md-3"><input type="text" id="newName" class="form-control" placeholder="Full Name *"></div>
                    <div class="col-md-2"><input type="text" id="newPhone" class="form-control" placeholder="Phone"></div>
                    <div class="col-md-3"><input type="text" id="newAddress" class="form-control" placeholder="Address"></div>
                    <div class="col-md-2"><input type="text" id="newNotes" class="form-control" placeholder="Notes"></div>
                    <div class="col-md-2"><button class="btn btn-primary w-100" onclick="addCustomer()">Add</button></div>
                </div>
            </div>
            <div class="panel mb-4">
                <input type="text" id="searchBox" class="form-control" placeholder="🔍 Search customers by name or phone..." oninput="searchCustomers()">
            </div>
            <div class="panel">
                <h5>Customers</h5>
                <div class="table-responsive mt-3">
                    <table class="table table-hover">
                        <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Notes</th><th class="text-end">Actions</th></tr></thead>
                        <tbody id="customersTable"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Order History: <span id="historyName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body"><div id="historyContent">Loading...</div></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const authToken = localStorage.getItem('authToken');
    if (!authToken) { window.location.href = '/login.html'; }

    let searchTimeout;
    function searchCustomers() { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => loadCustomers(), 300); }

    function loadCustomers() {
        const search = document.getElementById('searchBox').value;
        fetch('/api/customers?search=' + encodeURIComponent(search), { headers: { 'x-auth-token': authToken } })
            .then(res => {
                if (res.status === 401) { localStorage.removeItem('authToken'); window.location.href = '/login.html'; return; }
                return res.json();
            })
            .then(customers => {
                if (!customers) return;
                const table = document.getElementById('customersTable');
                if (customers.length === 0) {
                    table.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No customers yet.</td></tr>';
                    return;
                }
                table.innerHTML = customers.map(c => `
                    <tr>
                        <td><strong>${c.name}</strong></td>
                        <td>${c.phone || '-'}</td>
                        <td>${c.address || '-'}</td>
                        <td><small>${c.notes || '-'}</small></td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-info" onclick="viewHistory('${c.name.replace(/'/g, "\\'")}')">📋 History</button>
                            <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteCustomer(${c.id}, '${c.name.replace(/'/g, "\\'")}')">🗑</button>
                        </td>
                    </tr>
                `).join('');
            });
    }

    function addCustomer() {
        const name = document.getElementById('newName').value.trim();
        const phone = document.getElementById('newPhone').value.trim();
        const address = document.getElementById('newAddress').value.trim();
        const notes = document.getElementById('newNotes').value.trim();
        if (!name) return alert('Name is required.');
        fetch('/api/customers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-auth-token': authToken },
            body: JSON.stringify({ name, phone, address, notes })
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) return alert('Error: ' + data.error);
            document.getElementById('newName').value = '';
            document.getElementById('newPhone').value = '';
            document.getElementById('newAddress').value = '';
            document.getElementById('newNotes').value = '';
            loadCustomers();
        });
    }

    function deleteCustomer(id, name) {
        if (!confirm(`Delete customer "${name}"?`)) return;
        fetch('/api/customers/' + id, { method: 'DELETE', headers: { 'x-auth-token': authToken } }).then(() => loadCustomers());
    }

    function viewHistory(name) {
        document.getElementById('historyName').innerText = name;
        document.getElementById('historyContent').innerHTML = 'Loading...';
        const modal = new bootstrap.Modal(document.getElementById('historyModal'));
        modal.show();

        fetch('/api/customers/' + encodeURIComponent(name) + '/orders', { headers: { 'x-auth-token': authToken } })
            .then(res => res.json())
            .then(orders => {
                if (orders.length === 0) {
                    document.getElementById('historyContent').innerHTML = '<p class="text-muted text-center">No orders yet for this customer.</p>';
                    return;
                }
                let totalSpent = 0;
                const rows = orders.map(o => {
                    totalSpent += parseFloat(o.total);
                    const date = new Date(o.date).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
                    const badge = o.payment_status === 'Paid' ? 'bg-success' : 'bg-warning text-dark';
                    return `<tr><td>#${o.id}</td><td><small>${date}</small></td><td class="text-end">₱${parseFloat(o.total).toFixed(2)}</td><td><span class="badge ${badge}">${o.payment_status}</span></td></tr>`;
                }).join('');

                document.getElementById('historyContent').innerHTML = `
                    <div class="alert alert-info">Total Orders: <strong>${orders.length}</strong> | Total Spent: <strong>₱${totalSpent.toFixed(2)}</strong></div>
                    <table class="table table-sm">
                        <thead><tr><th>#</th><th>Date</th><th class="text-end">Total</th><th>Status</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                `;
            });
    }

    function logout() {
        const token = localStorage.getItem('authToken');
        if (token) fetch('/api/logout', { method: 'POST', headers: { 'x-auth-token': token } });
        localStorage.removeItem('authToken');
        window.location.href = '/login.html';
    }

    loadCustomers();
</script>
<script src="/theme.js"></script>
</body>
</html>
