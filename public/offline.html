<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Hawi's Lovada</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .offline-card {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            max-width: 400px;
            text-align: center;
            color: #1e293b;
        }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { color: #1e3a8a; font-size: 24px; margin-bottom: 12px; }
        p { color: #64748b; margin-bottom: 20px; line-height: 1.6; font-size: 14px; }
        .btn {
            background: #1e40af; color: white; border: none;
            padding: 14px 24px; font-weight: 700; border-radius: 10px;
            font-size: 15px; cursor: pointer; width: 100%;
            margin-bottom: 10px;
        }
        .btn:hover { background: #1e3a8a; }
        .tip {
            background: #eff6ff; border-left: 4px solid #3b82f6;
            padding: 12px; border-radius: 8px; font-size: 13px;
            color: #1e40af; margin-top: 20px; text-align: left;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>But don't worry — you can still use the POS. Orders will sync when internet is back.</p>
        <button class="btn" onclick="window.location.reload()">🔄 Retry</button>
        <button class="btn" onclick="window.location.href='/'" style="background: #10b981;">🏠 Open POS Anyway</button>
        <div class="tip">
            <strong>💡 Reminder:</strong>
            <ul style="margin: 8px 0 0 0; padding-left: 20px;">
                <li>Take orders normally</li>
                <li>Print receipts (Bluetooth)</li>
                <li>Orders auto-sync when online</li>
            </ul>
        </div>
    </div>
</body>
</html>
