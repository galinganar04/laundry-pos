<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Laundry POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #1e293b; color: white; min-height: 100vh; padding-top: 20px; }
        .sidebar a { color: #cbd5e1; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #3b82f6; color: white; border-radius: 5px; }
        .stat-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 4px solid #4f46e5; }
        .stat-card .label { font-size: 12px; text-transform: uppercase; color: #6b7280; letter-spacing: 1px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #1e293b; }
        .stat-card.green { border-left-color: #10b981; }
        .stat-card.orange { border-left-color: #f59e0b; }
        .stat-card.blue { border-left-color: #3b82f6; }
        .panel { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-bar { background: #4f46e5; border-radius: 4px 4px 0 0; display: inline-block; margin-right: 4px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-none d-md-block">
    <h4 class="text-center mb-4">Laundry POS</h4>
    <a href="/">🧺 POS</a>
    <a href="/dashboard.html" class="active">📊 Dashboard</a>
    <a href="/orders.html">📋 Orders</a>
    <a href="/customers.html">👥 Customers</a>
    <a href="/services.html">🧴 Services</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
    </div>

        <div class="col-md-10 p-4">
            <h3 class="mb-4">Sales Dashboard</h3>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="stat-card green">
                        <div class="label">Today's Revenue</div>
                        <div class="value" id="todayRevenue">₱0.00</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card blue">
                        <div class="label">Today's Orders</div>
                        <div class="value" id="todayOrders">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="label">All-Time Revenue</div>
                        <div class="value" id="allTimeRevenue">₱0.00</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card orange">
                        <div class="label">Pending Orders</div>
                        <div class="value" id="pendingOrders">0</div>
                    </div>
                </div>
            </div>

            <div class="panel mb-4">
                <h5>Last 7 Days</h5>
                <div id="weeklyChart" style="height: 220px; display: flex; align-items: flex-end; justify-content: center; gap: 20px; padding: 20px 0;"></div>
            </div>

            <div class="row g-3">
                <div class="col-md-5">
                    <div class="panel">
                        <h5>Top Services</h5>
                        <table class="table table-sm mt-3">
                            <thead><tr><th>Service</th><th class="text-end">Qty Sold</th><th class="text-end">Revenue</th></tr></thead>
                            <tbody id="topServicesTable">
                                <tr><td colspan="3" class="text-muted text-center">No data yet.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="panel">
                        <h5>Recent Orders</h5>
                        <table class="table table-sm mt-3">
                            <thead><tr><th>#</th><th>Date</th><th>Customer</th><th class="text-end">Total</th><th>Status</th></tr></thead>
                            <tbody id="recentOrdersTable">
                                <tr><td colspan="5" class="text-muted text-center">No orders yet.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const authToken = localStorage.getItem('authToken');
    if (!authToken) { window.location.href = '/login.html'; }

    fetch('/api/dashboard', { headers: { 'x-auth-token': authToken } })
        .then(res => {
            if (res.status === 401) { localStorage.removeItem('authToken'); window.location.href = '/login.html'; return; }
            return res.json();
        })
        .then(data => {
            if (!data) return;
            document.getElementById('todayRevenue').innerText = '₱' + data.today.revenue.toFixed(2);
            document.getElementById('todayOrders').innerText = data.today.orders;
            document.getElementById('allTimeRevenue').innerText = '₱' + data.allTime.revenue.toFixed(2);
            document.getElementById('pendingOrders').innerText = data.pending;

            const chart = document.getElementById('weeklyChart');
if (data.weekly.length === 0) {
    chart.innerHTML = '<p class="text-muted">No sales data yet.</p>';
} else {
    const maxRevenue = Math.max(...data.weekly.map(d => parseFloat(d.revenue)), 1);
    // Build bars with max-width to prevent single bar from stretching
    chart.innerHTML = data.weekly.map(day => {
        const height = (parseFloat(day.revenue) / maxRevenue) * 140;
        const date = new Date(day.day).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        return `
            <div style="width: 80px; text-align: center; margin-right: 12px;">
                <div style="font-size: 11px; color: #6b7280; margin-bottom: 4px;">₱${parseFloat(day.revenue).toFixed(0)}</div>
                <div class="chart-bar" style="height: ${Math.max(height, 4)}px; width: 40px; margin: 0 auto;"></div>
                <div style="font-size: 11px; margin-top: 6px;">${date}</div>
                <div style="font-size: 10px; color: #6b7280;">${day.order_count} orders</div>
            </div>
        `;
    }).join('');
}

            const servicesTable = document.getElementById('topServicesTable');
            if (data.topServices.length === 0) {
                servicesTable.innerHTML = '<tr><td colspan="3" class="text-muted text-center">No sales yet.</td></tr>';
            } else {
                servicesTable.innerHTML = data.topServices.map(s => `
                    <tr>
                        <td><strong>${s.service_name}</strong></td>
                        <td class="text-end">${s.total_qty}</td>
                        <td class="text-end">₱${parseFloat(s.total_revenue).toFixed(2)}</td>
                    </tr>
                `).join('');
            }

            const ordersTable = document.getElementById('recentOrdersTable');
            if (data.recentOrders.length === 0) {
                ordersTable.innerHTML = '<tr><td colspan="5" class="text-muted text-center">No orders yet.</td></tr>';
            } else {
                ordersTable.innerHTML = data.recentOrders.map(o => {
                    const date = new Date(o.date).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
                    const statusBadge = o.payment_status === 'Paid' ? 'bg-success' : 'bg-warning text-dark';
                    return `
                        <tr>
                            <td>#${o.id}</td>
                            <td><small>${date}</small></td>
                            <td>${o.customer}</td>
                            <td class="text-end"><strong>₱${parseFloat(o.total).toFixed(2)}</strong></td>
                            <td><span class="badge ${statusBadge}">${o.payment_status}</span></td>
                        </tr>
                    `;
                }).join('');
            }
        });

    function logout() {
        const token = localStorage.getItem('authToken');
        if (token) fetch('/api/logout', { method: 'POST', headers: { 'x-auth-token': token } });
        localStorage.removeItem('authToken');
        window.location.href = '/login.html';
    }
</script>
</body>
</html>
